name: CI

on:
  push:
    branches:
      - main
      - development
      - feature/reports
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        id: run-tests
        run: mvn test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: target/surefire-reports

      - name: Extract failed tests reports
        if: failure()
        run:
          mkdir -p failed-test-reports
          for report in $(find target/surefire-reports -name '*.txt'); do
            if grep -q 'FAILED' "$report"; then
              cp "$report" "failed-test-reports/$(basename $report)"
            fi
          done

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: failed-test-reports
          path: failed-test-reports

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Deploy
        run: echo "Deploying..."

  report:
    if: failure()
    needs: [ test, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "something went wrong"
#          echo "${{ toJSON(github) }}"

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: failed-test-reports
          path: failed-test-reports

          
